[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyinfluence"
version = "0.5.0"
description = "Training data attribution for scikit-learn models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Marc-Andre Schulz", email = "marc.a.schulz@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["machine-learning", "interpretability", "influence-functions", "sklearn"]

# Floors are the oldest releases the suite passes on that also have cp310
# wheels; pytest-min-deps installs exactly these. scikit-learn below 1.2 has no
# LogisticRegression(penalty=None), and 1.2 itself requires joblib >= 1.1.1.
dependencies = [
    "joblib>=1.1.1",
    "numpy>=1.21.2",
    "scipy>=1.7.2",
    "scikit-learn>=1.2",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# matplotlib >= 3.9 is required (boxplot(tick_labels=...))
viz = ["matplotlib>=3.9"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.5",
    "mypy>=1.0",
    "matplotlib>=3.9",
]

[project.urls]
"Homepage" = "https://github.com/maschulz/pyinfluence"
"Bug Tracker" = "https://github.com/maschulz/pyinfluence/issues"
"Source Code" = "https://github.com/maschulz/pyinfluence"
"Changelog" = "https://github.com/maschulz/pyinfluence/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyinfluence*"]

[tool.setuptools.package-data]
pyinfluence = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"
# showcase.ipynb is generated by examples/_build_notebook.py (the linted
# source of truth); do not lint the build artifact.
extend-exclude = ["examples/showcase.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
  "E501",  # line length is enforced by the formatter for code; prose is exempt
  "C408",  # dict(a=1) reads well for kwargs-style construction
]

[tool.ruff.lint.isort]
known-first-party = ["pyinfluence"]

[tool.ruff.format]
# ruff 0.16 formats Python inside Markdown. README examples are written to
# be read, not to match source style: aligned comment columns and grouped
# call arguments carry meaning the formatter flattens, and test_readme.py
# executes the blocks, so a mangled comment would pass unnoticed.
exclude = ["*.md"]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "joblib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=pyinfluence --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
joblib = ">=1.1.1"
numpy = ">=1.21.2"
scipy = ">=1.7.2"
scikit-learn = ">=1.2"
tqdm = ">=4.60"
ipykernel = ">=6.30.1,<8"

[tool.pixi.pypi-dependencies]
pyinfluence = { path = ".", editable = true, extras = ["dev", "viz"] }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = ["py312"]
py310 = ["py310"]
py311 = ["py311"]
py313 = ["py313"]

[tool.pixi.tasks]
test = "pytest"
test-fast = "pytest -m 'not slow'"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "mypy pyinfluence"
