[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyinfluence"
version = "0.4.1"
description = "Training data attribution for scikit-learn models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Marc-Andre Schulz", email = "marc.a.schulz@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["machine-learning", "interpretability", "influence-functions", "sklearn"]

dependencies = [
    "joblib>=1.0",
    "numpy>=1.20",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# matplotlib >= 3.9 is required (boxplot(tick_labels=...))
viz = ["matplotlib>=3.9"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/maschulz/pyinfluence"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyinfluence*"]

[tool.ruff]
line-length = 88
target-version = "py39"
# showcase.ipynb is generated by examples/_build_notebook.py (the linted
# source of truth); do not lint the build artifact.
extend-exclude = ["examples/showcase.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
  "E501",  # line length is enforced by the formatter for code; prose is exempt
  "C408",  # dict(a=1) reads well for kwargs-style construction
]

[tool.ruff.lint.isort]
known-first-party = ["pyinfluence"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "joblib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=pyinfluence --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
joblib = ">=1.0"
numpy = ">=1.20"
scipy = ">=1.7"
scikit-learn = ">=1.0"
tqdm = ">=4.60"
ipykernel = ">=6.30.1,<8"

[tool.pixi.pypi-dependencies]
pyinfluence = { path = ".", editable = true, extras = ["dev", "viz"] }

[tool.pixi.feature.py39.dependencies]
python = "3.9.*"
[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = ["py312"]
py39 = ["py39"]
py310 = ["py310"]
py311 = ["py311"]
py313 = ["py313"]

[tool.pixi.tasks]
test = "pytest"
test-fast = "pytest -m 'not slow'"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "mypy pyinfluence"
