name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check pyinfluence/ tests/

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          PYTHONUNBUFFERED: 1
        run: pytest

  pytest-viz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[viz,dev]"
      - name: Run tests (viz)
        env:
          PYTHONUNBUFFERED: 1
        run: pytest

  # Pin the declared minimum matplotlib so pyproject's lower bound stays
  # honest (viz once used an API newer than the declared minimum and only
  # latest-matplotlib CI hid it).
  pytest-viz-min-matplotlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies (minimum matplotlib)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "matplotlib==3.9.*"
      - name: Run viz tests against minimum matplotlib
        env:
          PYTHONUNBUFFERED: 1
        run: pytest tests/test_viz.py
