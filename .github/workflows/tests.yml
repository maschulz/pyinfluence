name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: mypy (non-blocking)
        run: mypy pyinfluence
        continue-on-error: true

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          PYTHONUNBUFFERED: 1
        run: pytest --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            coverage.xml
            .coverage
          retention-days: 7

  pytest-viz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[viz,dev]"
      - name: Run tests (viz)
        env:
          PYTHONUNBUFFERED: 1
        run: pytest

  # Pin the declared minimum matplotlib so pyproject's lower bound stays
  # honest (viz once used an API newer than the declared minimum and only
  # latest-matplotlib CI hid it).
  pytest-viz-min-matplotlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies (minimum matplotlib)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "matplotlib==3.9.*"
      - name: Run viz tests against minimum matplotlib
        env:
          PYTHONUNBUFFERED: 1
        run: pytest tests/test_viz.py

  # The lower bounds in pyproject are a claim nothing else checks: every job
  # above installs the latest of everything. Install the exact floors and run
  # the suite. matplotlib is left out because its own floor needs numpy >=
  # 1.23; the viz tests skip when it is missing.
  pytest-min-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimum declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            "numpy==1.21.2" "scipy==1.7.2" "scikit-learn==1.2.2" \
            "joblib==1.1.1" "tqdm==4.60" "pytest>=7" "pytest-cov>=4"
      - name: Run tests against minimum dependencies
        env:
          PYTHONUNBUFFERED: 1
        run: pytest
